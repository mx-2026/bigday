<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>1107 Big Day</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Microsoft JhengHei',sans-serif}
:root{--bg:#FAF8F5;--card:#fff;--tx:#2b2b2b;--mu:#8a857f;--ln:#E9E5DF;--ac:#B9793A;--soft:#FBEFDA}
body{background:var(--bg);color:var(--tx);max-width:720px;margin:auto;padding:0 12px 90px}
header{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 6px;z-index:5}
h1{font-size:1.15rem}.sub{color:var(--ac);font-size:.8rem;margin-top:2px}
.bar{height:4px;background:var(--ln);border-radius:9px;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
.tabs button{flex-shrink:0;border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:20px;font-size:.85rem}
.tabs .on{background:var(--tx);color:#fff}
.tool{display:flex;gap:10px;align-items:center;font-size:.78rem;color:var(--mu);margin:2px 0 4px}
.tool select{border:1px solid var(--ln);border-radius:10px;padding:4px 8px;background:#fff;font-size:.8rem}
.tool button{margin-left:auto;border:1px solid var(--ln);background:#fff;border-radius:10px;padding:4px 10px;font-size:.78rem;color:var(--mu)}
h4{font-size:.76rem;color:var(--mu);font-weight:600;margin:16px 0 6px;letter-spacing:.03em}
.it{background:var(--card);border-bottom:1px solid var(--ln);padding:11px 8px;display:flex;gap:10px;align-items:center}
.it:first-of-type{border-radius:12px 12px 0 0}.it:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.it.done .m{opacity:.4;text-decoration:line-through}
.it.now{background:var(--soft);box-shadow:inset 3px 0 var(--ac)}
.s{width:24px;height:24px;border-radius:50%;border:2px solid #cfc8bd;background:#fff;flex-shrink:0}
.s[data-d="1"]{background:#3F7A48;border-color:#3F7A48}
.t{width:46px;flex-shrink:0;font-weight:600;color:var(--ac);font-size:.85rem}
.m{flex:1;min-width:0;cursor:pointer}.m b{font-weight:500;font-size:.92rem}.m small{display:block;color:var(--mu);font-size:.74rem;margin-top:2px}
.late{color:#C0392B!important}
.ar button{border:1px solid var(--ln);background:#fff;border-radius:8px;width:30px;height:30px;margin-left:3px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:1.8rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}.sh.on{display:flex}
.box{background:#fff;width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow:auto}
.box input,.box select,.box textarea{padding:11px;border:1px solid var(--ln);border-radius:12px;font-size:16px;width:100%}
.ac{display:flex;gap:8px}.btn{flex:1;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:600}.btn.g{background:#eee;color:var(--tx)}
summary{font-size:.8rem;color:var(--mu);margin:4px 0}
.cal{position:relative;margin:8px 0 0 46px}.hr{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}.hr i{position:absolute;left:-46px;top:-8px;font-size:.7rem;color:var(--mu);font-style:normal}
.ev{position:absolute;left:4px;right:0;border-radius:8px;padding:2px 8px;font-size:.78rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#F3E3C8;border-left:4px solid var(--ac);cursor:pointer}
.ev.g1{background:#E6E2DA;border-color:#8a857f}.ev.g2{background:#FBEFDA;border-color:#6b4a22}.ev b{color:var(--ac)}
.nw{position:absolute;left:-6px;right:0;border-top:2px solid #C0392B;z-index:2}
</style></head><body>
<header><h1>💍 1107 Big Day</h1><div class="sub" id="cd"></div><div class="bar"><i id="pg" style="width:0"></i></div>
<div class="tabs" id="tabs"></div><div class="tool" id="tool"></div></header>
<div id="list"></div>
<button class="fab" onclick="add()">＋</button>
<div class="sh" id="sh" onclick="if(event.target==this)clr()"><div class="box"><b id="sh-t"></b>
<input id="f-title" placeholder="內容 *"><input id="f-grp" list="gl" placeholder="分類（階段/枱號/地點）"><datalist id="gl"></datalist>
<select id="f-owner"></select><input id="f-tm"><input id="f-note" placeholder="備註">
<div class="ac"><button class="btn g" id="f-del" onclick="del()">刪除</button><button class="btn g" onclick="clr()">取消</button><button class="btn" onclick="save()">儲存</button></div>
<details id="bkd"><summary>批量新增（Excel 直接貼：分類 ⇥ 內容 ⇥ 備註）</summary><textarea id="bk" rows="4"></textarea><button class="btn" style="width:100%;margin-top:6px" onclick="bulk()">批量加入</button></details></div></div>
<script src="config.js"></script>
<script>
const C=window.CFG,B=C.URL+'/rest/v1/items',$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K={run:{n:'時間軸',t:'time',nd:1,bt:1},cal:{n:'日曆',no:1,nd:1,t:'time',bt:1},game:{n:'遊戲'},task:{n:'任務',t:'date',bt:1},mine:{n:'我的清單'},pack:{n:'物資'},seat:{n:'座位',no:1},car:{n:'車隊',no:1,nd:1},music:{n:'歌單',nd:1},gold:{n:'金器'},person:{n:'人員',no:1,nd:1}};
const q=new URLSearchParams(location.search),today=new Date().toISOString().slice(0,10),big=today==C.DATE;
let PC=localStorage.bd_pc||'',D=[],cur=q.get('me')?'mine':big?'run':'task',sig='',eid=null,F=q.get('me')||localStorage.bd_f||'',HD=0,ord=0,sc=0,VIS=[];
try{D=JSON.parse(localStorage.bd_d||'[]')}catch(e){}
const H=x=>({apikey:C.KEY,'x-pin':PC,'Content-Type':'application/json',...x});
const ppl=()=>D.filter(x=>x.kind=='person').sort((a,b)=>a.sort-b.sort||a.id-b.id);
const opts=v=>'<option value="">未分配</option>'+ppl().map(p=>`<option ${p.title==v?'selected':''}>${esc(p.title)}</option>`).join('');
const list=k=>D.filter(x=>x.kind==(k=='cal'?'run':k)).filter(x=>1).sort((a,b)=>(K[k].bt?(a.tm||'99').localeCompare(b.tm||'99'):0)||a.sort-b.sort||a.id-b.id);
const gk=x=>(cur=='mine'&&!F)?(x.owner||'未分配'):(x.grp||'（未分類）');
async function req(m,p,b){const r=await fetch(B+p,{method:m,headers:H({Prefer:'return=minimal'}),body:b?JSON.stringify(b):undefined});if(!r.ok){alert('儲存失敗，請重試');throw 0}}
const w=async(m,p,b)=>{await req(m,p,b);load(1)};
async function load(f){try{const r=await fetch(B+'?select=upd&order=upd.desc&limit=1',{headers:H({Prefer:'count=exact'})});if(!r.ok)return;
 const s=((await r.json())[0]||{}).upd+'|'+r.headers.get('content-range');if(!f&&s==sig)return;sig=s;
 D=await(await fetch(B+'?select=*&order=sort,id',{headers:H()})).json();try{localStorage.bd_d=JSON.stringify(D)}catch(e){}draw()}catch(e){}}
function tab(k){cur=k;sc=0;draw()}
function draw(){const k=cur,c=K[k],T=D.filter(x=>x.kind=='task'),dn=T.filter(x=>x.done).length,d=Math.ceil((new Date(C.DATE)-new Date())/864e5);
 $('cd').textContent=(big?'🎉 今日大日子':d>0?`距離大日子 ${d} 日`:'Big Day')+`｜任務 ${dn}/${T.length}`;$('pg').style.width=(T.length?dn/T.length*100:0)+'%';
 $('tabs').innerHTML=Object.keys(K).map(x=>`<button class="${x==k?'on':''}" onclick="tab('${x}')">${K[x].n}</button>`).join('');
 $('tool').innerHTML=(c.no?'':`睇 <select onchange="F=this.value;localStorage.bd_f=F;draw()">${'<option value="">全部人</option>'+ppl().map(p=>`<option ${F==p.title?'selected':''}>${esc(p.title)}</option>`).join('')}</select>`)
  +(c.nd?'':`<label><input type="checkbox" ${HD?'checked':''} onchange="HD=this.checked;draw()"> 收起已完成</label>`)
  +(c.bt?'':`<button onclick="ord=!ord;draw()">${ord?'完成排序':'排序'}</button>`);
 if(k=='cal'){cal();return}
 const it=list(k).filter(x=>c.no||!F||x.owner==F).filter(x=>!HD||!x.done);VIS=it;
 let nid=0;if(big&&k=='run'){const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');it.forEach(x=>{if(x.tm&&x.tm<=hm)nid=x.id})}
 const gs=[...new Set(it.map(gk))];
 $('list').innerHTML=(k=='seat'?'<details open><summary style="color:var(--mu);font-size:.8rem;margin-top:8px">場地圖（Park Lane）</summary><img src="floorplan.png" style="width:100%;border-radius:12px;background:#fff"></details>':'')+(D.length?'':'<p style="color:var(--mu);margin-top:20px">載入中…</p>')+gs.map(g=>{const V=it.filter(x=>gk(x)==g);
  return `<h4>${esc(g)} · ${c.nd?V.length:V.filter(x=>x.done).length+'/'+V.length}</h4><div>`+V.map(x=>{
   const late=k=='task'&&x.tm&&x.tm<today&&!x.done,meta=[k=='mine'&&F?'':x.owner,k=='task'?x.tm:'',k=='car'?x.grp:'',x.note].filter(Boolean).join(' · ');
   return `<div class="it${x.done?' done':''}${x.id==nid?' now':''}" id="i${x.id}">${c.nd?'':`<button class="s" data-d="${x.done?1:0}" onclick="up(${x.id},{done:${!x.done}})"></button>`}${k=='run'?`<span class="t">${esc(x.tm)}</span>`:''}
   <div class="m" onclick="ed(${x.id})"><b>${x.id==nid?'▶ ':''}${esc(x.title)}</b>${meta?`<small class="${late?'late':''}">${esc(meta)}</small>`:''}</div>
   ${ord&&!c.bt?`<span class="ar"><button onclick="mv(${x.id},-1)">↑</button><button onclick="mv(${x.id},1)">↓</button></span>`:''}</div>`}).join('')+'</div>'}).join('');
 if(nid&&!sc){sc=1;setTimeout(()=>$('i'+nid)?.scrollIntoView({block:'center'}),50)}}
function cal(){const L=list('run').filter(x=>x.tm),m=t=>{const[h,i]=t.split(':');return +h*60+ +i},S=360,E=1440,P=1.3,G=['寶琳女家','WM Hotel','Park Lane'];let h='';
 for(let t=S;t<=E;t+=60)h+=`<div class="hr" style="top:${(t-S)*P}px"><i>${String(t/60).padStart(2,'0')}:00</i></div>`;
 L.forEach((x,i)=>{const a=m(x.tm),b=i<L.length-1?m(L[i+1].tm):a+30;h+=`<div class="ev g${G.indexOf(x.grp)}" style="top:${(a-S)*P}px;height:${Math.max((b-a)*P-2,22)}px" onclick="ed(${x.id})"><b>${x.tm}</b> ${esc(x.title)}</div>`});
 if(big){const n=new Date(),a=n.getHours()*60+n.getMinutes();if(a>=S&&a<=E)h+=`<div class="nw" style="top:${(a-S)*P}px"></div>`}
 $('list').innerHTML=`<div class="cal" style="height:${(E-S)*P}px">${h}</div>`;
 if(big&&!sc){sc=1;const n=new Date();scrollTo(0,Math.max(0,(n.getHours()*60+n.getMinutes()-S)*P-150))}}
const up=(id,b)=>{Object.assign(D.find(x=>x.id==id),b);draw();w('PATCH','?id=eq.'+id,b)};
function fill(x){const c=K[cur];$('sh-t').textContent=(eid?'修改':'新增')+' · '+c.n;$('f-title').value=x.title||'';$('f-grp').value=x.grp||'';
 $('f-owner').innerHTML=opts(eid?x.owner:F);$('f-owner').style.display=c.no?'none':'';const t=$('f-tm');t.style.display=c.t?'':'none';t.type=c.t||'text';t.value=x.tm||'';
 $('f-note').value=x.note||'';$('f-del').style.display=eid?'':'none';$('bkd').style.display=eid?'none':'';
 $('gl').innerHTML=[...new Set(list(cur).map(y=>y.grp))].map(g=>`<option value="${esc(g)}">`).join('');$('sh').classList.add('on')}
const add=()=>{eid=null;fill({})},ed=id=>{eid=id;fill(D.find(y=>y.id==id))};
function clr(){$('sh').classList.remove('on');eid=null}
const nxt=()=>Math.max(0,...list(cur).map(x=>x.sort))+1;
function save(){const t=$('f-title').value.trim();if(!t)return;const b={title:t,grp:$('f-grp').value,owner:K[cur].no?'':$('f-owner').value,tm:$('f-tm').value,note:$('f-note').value};
 if(eid)w('PATCH','?id=eq.'+eid,b);else w('POST','',{...b,kind:cur=='cal'?'run':cur,sort:nxt()});clr()}
async function del(){if(!confirm('確定刪除？'))return;if(!PC){PC=prompt('刪除需要通行碼（問新人/伴娘）')||'';localStorage.bd_pc=PC}
 const r=await fetch(B+'?id=eq.'+eid,{method:'DELETE',headers:H({Prefer:'return=representation'})});const j=r.ok?await r.json():[];
 if(!j.length){PC='';localStorage.removeItem('bd_pc');alert('通行碼錯誤，未能刪除')}clr();load(1)}
function bulk(){const g0=$('f-grp').value,o=$('f-owner').value,n=nxt();
 const r=$('bk').value.split('\n').map(s=>s.trim()).filter(Boolean).map((s,i)=>{const p=s.split(/\t|[,，]/).map(z=>z.trim()),h=p.length>1;return{kind:cur=='cal'?'run':cur,grp:h?p[0]:g0,title:h?p[1]:s,note:h?p.slice(2).join(' '):'',owner:o,sort:n+i}});
 if(r.length){w('POST','',r);$('bk').value='';clr()}}
async function mv(id,d){const me=D.find(x=>x.id==id),V=VIS.filter(x=>gk(x)==gk(me)),o=V[V.findIndex(x=>x.id==id)+d];if(!o)return;
 const L=list(cur),a=L.findIndex(x=>x.id==id),b=L.findIndex(x=>x.id==o.id);[L[a],L[b]]=[L[b],L[a]];
 await Promise.all(L.map((x,n)=>x.sort==n+1?0:req('PATCH','?id=eq.'+x.id,{sort:n+1})));load(1)}
draw();load(1);setInterval(()=>{if(!document.hidden)load()},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
