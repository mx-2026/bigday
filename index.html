<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>1107 Big Day</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Microsoft JhengHei',sans-serif}
:root{--bg:#FAF8F5;--card:#fff;--tx:#2b2b2b;--mu:#8a857f;--ln:#E9E5DF;--ac:#B9793A;--soft:#FBEFDA}
body{background:var(--bg);color:var(--tx);max-width:720px;margin:auto;padding:0 12px 90px}
header{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 6px;z-index:5}
h1{font-size:1.15rem}.sub{color:var(--ac);font-size:.8rem;margin-top:2px}
.bar{height:4px;background:var(--ln);border-radius:9px;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
.tabs button{flex-shrink:0;border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:20px;font-size:.85rem}
.tabs .on{background:var(--tx);color:#fff}
.tool{display:flex;gap:10px;align-items:center;font-size:.78rem;color:var(--mu);margin:2px 0 4px}
.tool select{border:1px solid var(--ln);border-radius:10px;padding:4px 8px;background:#fff;font-size:.8rem}
.tool button{margin-left:auto;border:1px solid var(--ln);background:#fff;border-radius:10px;padding:4px 10px;font-size:.78rem;color:var(--mu)}
h4{font-size:.76rem;color:var(--mu);font-weight:600;margin:16px 0 6px;letter-spacing:.03em}
.it{background:var(--card);border-bottom:1px solid var(--ln);padding:11px 8px;display:flex;gap:10px;align-items:center}
.it:first-of-type{border-radius:12px 12px 0 0}.it:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.it.done .m{opacity:.4;text-decoration:line-through}
.it.now{background:var(--soft);box-shadow:inset 3px 0 var(--ac)}
.s{width:24px;height:24px;border-radius:50%;border:2px solid #cfc8bd;background:#fff;flex-shrink:0}
.s[data-d="1"]{background:#3F7A48;border-color:#3F7A48}
.t{width:46px;flex-shrink:0;font-weight:600;color:var(--ac);font-size:.85rem}
.m{flex:1;min-width:0;cursor:pointer}.m b{font-weight:500;font-size:.92rem}.m small{display:block;color:var(--mu);font-size:.74rem;margin-top:2px}
.late{color:#C0392B!important}
.ar button{border:1px solid var(--ln);background:#fff;border-radius:8px;width:30px;height:30px;margin-left:3px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:1.8rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}.sh.on{display:flex}
.box{background:#fff;width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-height:90vh;overflow:auto}
.box input,.box select,.box textarea{padding:11px;border:1px solid var(--ln);border-radius:12px;font-size:16px;width:100%}
.ac{display:flex;gap:8px}.btn{flex:1;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:600}.btn.g{background:#eee;color:var(--tx)}
summary{font-size:.8rem;color:var(--mu);margin:4px 0}
.cal{position:relative;margin:8px 0 0 46px}.hr{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}.hr i{position:absolute;left:-46px;top:-8px;font-size:.7rem;color:var(--mu);font-style:normal}
.ev{position:absolute;left:4px;right:0;border-radius:8px;padding:2px 8px;font-size:.78rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#F3E3C8;border-left:4px solid var(--ac);cursor:pointer}
.ev.g1{background:#E6E2DA;border-color:#8a857f}.ev.g2{background:#FBEFDA;border-color:#6b4a22}.ev b{color:var(--ac)}
.nw{position:absolute;left:-6px;right:0;border-top:2px solid #C0392B;z-index:2}
